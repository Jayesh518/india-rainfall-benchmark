name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest pytest-cov ruff mypy

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy src --ignore-missing-imports
        continue-on-error: true    # advisory while modules are still stubs

      - name: Test
        env:
          PYTHONPATH: src
        run: pytest -q --cov=indiarain --cov-report=term-missing
