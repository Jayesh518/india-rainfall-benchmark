[project]
name = "indiarain"
version = "0.1.0"
description = "Next-day rainfall prediction over India: a multi-source, multi-model benchmark of skill, calibration and decision value."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jayesh Chaudhari" }]
keywords = ["rainfall", "india", "monsoon", "forecasting", "calibration", "benchmark"]

# Core pipeline only. Heavier model families live in optional extras so the
# base install stays usable on a laptop.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",          # parquet
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "xarray>=2024.6",         # NetCDF / gridded data
    "netcdf4>=1.7",
    "imdlib>=0.1.2",          # D1: IMD gridded rainfall
    "requests>=2.32",
    "httpx>=0.27",            # D3/D4 async fetching
    "tenacity>=8.5",          # retry/backoff on API fetches
    "hydra-core>=1.3",
    "pandera>=0.20",          # schema validation
    "joblib>=1.4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "cdsapi>=0.7",            # D4 alternative: Copernicus CDS ERA5 (no Open-Meteo quota)
    "h5netcdf>=1.3",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.1", "lightgbm>=4.5", "catboost>=1.2", "ngboost>=0.5"]
calibration = ["mapie>=0.9"]                     # conformal prediction
deep = ["torch>=2.4", "pytorch-lightning>=2.4", "pytorch-forecasting>=1.1"]
graph = ["torch-geometric>=2.6"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3"]
explain = ["shap>=0.46", "alibi>=0.9"]
tuning = ["optuna>=3.6", "mlflow>=2.15"]
app = ["fastapi>=0.112", "uvicorn>=0.30", "streamlit>=1.37", "onnxruntime>=1.18"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indiarain"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]                                 # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running (model training)",
    "network: requires internet access to a data provider",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
